<!DOCTYPE html>
<html>

<head>

    <title>DemandIQ Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{

            background:#f4f7fb;

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;

            font-family:Segoe UI;

        }

        .login-card{

            width:420px;

            border-radius:15px;

            box-shadow:0px 5px 25px rgba(0,0,0,.15);

            background:white;

            padding:40px;

        }

        h2{

            text-align:center;

            margin-bottom:25px;

            color:#0d6efd;

            font-weight:bold;

        }

    </style>

</head>

<body>

<div class="login-card">

<h2>DemandIQ</h2>

<form method="POST" action="/login">

<div class="mb-3">

<label>Username</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<button
class="btn btn-primary w-100">

Login

</button>

</form>

</div>

</body>

</html>
