<!DOCTYPE html>
<html>
<head>

    <title>Inventory | DemandIQ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">
        📦 Inventory Management
    </h2>

    <table class="table table-bordered table-hover table-striped">

        <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Product</th>
                <th>Brand</th>
                <th>Branch</th>
                <th>Stock</th>
                <th>Reorder Level</th>
                <th>Status</th>

            </tr>

        </thead>

        <tbody>

        {% for item in inventory %}

        <tr>

            <td>{{ item[0] }}</td>

            <td>{{ item[1] }}</td>

            <td>{{ item[2] }}</td>

            <td>{{ item[3] }}</td>

            <td>{{ item[4] }}</td>

            <td>{{ item[5] }}</td>

            <td>

                {% if item[4] <= item[5] %}

                    <span class="badge bg-danger">
                        Low Stock
                    </span>

                {% else %}

                    <span class="badge bg-success">
                        Available
                    </span>

                {% endif %}

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
